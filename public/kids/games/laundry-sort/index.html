<!doctype html><html lang="tr"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><script>const lifeosGameStorage=(()=>{const data=new Map();return{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k),clear:()=>data.clear()}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Çamaşır Sepetleri · LifeOS</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:Arial,sans-serif;background:#dff6ff;color:#11324d}.wrap{max-width:480px;height:100%;margin:auto;padding:10px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud,footer{display:flex;justify-content:space-between;background:#fff;border-radius:14px;padding:10px}.game{flex:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center}.cloth{font-size:76px;filter:drop-shadow(0 6px 3px #0002)}.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.bin,.btn{min-height:68px;border:0;border-radius:18px;font-size:19px;font-weight:900;color:#fff}.red{background:#ef476f}.blue{background:#118ab2}.yellow{background:#e9a800}.msg{min-height:25px;font-weight:800}.home{color:#11324d}.overlay{position:fixed;inset:0;background:#0019;display:grid;place-items:center;padding:20px}.card{background:#fff;border-radius:22px;padding:24px;max-width:350px;text-align:center;display:grid;gap:14px}.hidden{display:none}
</style><!-- jangyoon-s-game catalog metadata -->



</head><body><main class="wrap"><h1>Çamaşır Sepetleri</h1><div class="hud"><b>Toplanan<span id="score">0</span></b><b>Süre<span id="time">40</span></b></div><section class="game"><div class="cloth" id="cloth">👕</div><p class="msg" id="msg">Aynı renkteki sepete dokun!</p><div class="bins"><button class="bin red" data-c="red">Kırmızı</button><button class="bin blue" data-c="blue">mavi</button><button class="bin yellow" data-c="yellow">sarı</button></div></section><footer><small>Renge bak ve sepet seç</small></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🧺 Çamaşır zamanı</h2><p>Kıyafetle aynı renkteki sepete dokun. Yanlış seçince puan azalmaz.</p><button class="btn blue" id="startBtn">başlangıç!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>✨ Toplama tamamlandı!</h2><b id="finalScore"></b><p id="best"></p><button class="btn blue" id="restartBtn">tekrar yap</button></div></div><script>
(()=>{'use strict';const COLORS={red:'#ef476f',blue:'#118ab2',yellow:'#ffd166'},ICONS=['👕','🧦','👚','🩳'];let answer,score=0,left=40,timer;const $=id=>document.getElementById(id);function next(){const ks=Object.keys(COLORS);answer=ks[Math.floor(Math.random()*ks.length)];$('cloth').textContent=ICONS[Math.floor(Math.random()*ICONS.length)];$('cloth').style.background=COLORS[answer];$('cloth').style.borderRadius='22px';$('cloth').style.padding='8px 18px'}function pick(c){if(c===answer){score++;$('score').textContent=score;$('msg').textContent="Güzel! 👏";next()}else $('msg').textContent="Renge bir daha bakalım 🙂"}function start(){score=0;left=40;$('score').textContent=0;$('time').textContent=left;$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');next();clearInterval(timer);timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)}function end(){clearInterval(timer);const old=+(lifeosGameStorage.getItem('laundry-sort_best')||0),best=Math.max(old,score);lifeosGameStorage.setItem('laundry-sort_best',best);$('finalScore').textContent=`${score} kıyafet toplandı!`;$('best').textContent=`En iyi: ${best}kıyafet`;$('endOverlay').classList.remove('hidden')};document.querySelector('.bins').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&left>0)pick(b.dataset.c)});$('startBtn').onclick=start;$('restartBtn').onclick=start})();
</script></body></html>
