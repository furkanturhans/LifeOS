<!doctype html><html lang="tr"><head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><script>const lifeosGameStorage=(()=>{const data=new Map();return{getItem:k=>data.get(k)??null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k),clear:()=>data.clear()}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sandviç Siparişi · LifeOS</title><style>
*{box-sizing:border-box;margin:0}html,body{height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;font-family:Arial,sans-serif;background:#fff4d6;color:#42210b}.wrap{max-width:480px;height:100%;margin:auto;padding:10px;display:flex;flex-direction:column;gap:8px}h1{text-align:center;font-size:clamp(20px,5.5vw,28px)}.hud,.order,.tray,footer{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px}.order{justify-content:center;font-size:30px;min-height:68px}.tray{flex:1;flex-direction:column;justify-content:center;gap:12px}.stack{font-size:42px;min-height:56px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.choices button,.btn{min-height:52px;border:0;border-radius:14px;background:#ffb703;font-size:24px;font-weight:800}.msg{min-height:24px;font-weight:700;text-align:center}.home{color:#42210b}.overlay{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.card{max-width:360px;background:#fff;border-radius:22px;padding:24px;text-align:center;display:grid;gap:14px}.hidden{display:none}
</style><!-- jangyoon-s-game catalog metadata -->



</head><body><main class="wrap"><h1>Sandviç Siparişi</h1><div class="hud"><b>Hazırlanan<span id="score">0</span></b><b>Süre<span id="time">45</span></b></div><div class="order" id="order">🍞 🥬 🧀 🍞</div><section class="tray"><div class="stack" id="stack">Tabak boş</div><div class="choices" id="choices"><button data-x="🍞">🍞</button><button data-x="🥬">🥬</button><button data-x="🧀">🧀</button><button data-x="🍅">🍅</button><button data-x="🥚">🥚</button><button data-x="🥓">🥓</button></div><p class="msg" id="msg">Malzemelere siparişteki sırayla dokun!</p></section><footer><small>Yanlışta yeniden deneyebilirsin</small></footer></main><div class="overlay" id="startOverlay"><div class="card"><h2>🥪 Siparişi hatırla</h2><p>Yukarıdaki malzemelere soldan sağa sırayla dokun ve sandviçi hazırla.</p><button class="btn" id="startBtn">başlangıç!</button></div></div><div class="overlay hidden" id="endOverlay"><div class="card"><h2>🎉 Mutfak turu tamamlandı!</h2><b id="finalScore"></b><p id="best"></p><button class="btn" id="restartBtn">tekrar yap</button></div></div><script>
(()=>{'use strict';const ALL=['🥬','🧀','🍅','🥚','🥓'],BREAD='🍞';let goal=[],made=[],score=0,left=45,timer;const $=id=>document.getElementById(id);function next(){goal=[BREAD,...Array.from({length:2+Math.min(2,Math.floor(score/3))},()=>ALL[Math.floor(Math.random()*ALL.length)]),BREAD];made=[];$('order').textContent=goal.join(' ');draw()}function draw(){$('stack').textContent=made.length?made.join(' '):"Tabak boş"}function tap(x){if(x===goal[made.length]){made.push(x);draw();if(made.length===goal.length){score++;$('score').textContent=score;$('msg').textContent="Hazır! Yeni sipariş geldi 👏";setTimeout(next,350)}}else{$('msg').textContent="Sıraya bir daha bakalım 🙂";made=[];draw()}}function start(){score=0;left=45;$('score').textContent=0;$('time').textContent=left;$('startOverlay').classList.add('hidden');$('endOverlay').classList.add('hidden');next();clearInterval(timer);timer=setInterval(()=>{left--;$('time').textContent=left;if(left<=0)end()},1000)}function end(){clearInterval(timer);const old=+(lifeosGameStorage.getItem('sandwich-order_best')||0),best=Math.max(old,score);lifeosGameStorage.setItem('sandwich-order_best',best);$('finalScore').textContent=`${score} tane hazır!`;$('best').textContent=`En iyi: ${best}köpek`;$('endOverlay').classList.remove('hidden')}$('choices').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&left>0)tap(b.dataset.x)});$('startBtn').onclick=start;$('restartBtn').onclick=start})();
</script></body></html>
